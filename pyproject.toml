[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensa-ai"  # geçici ad, yeni isim bekleniyor (D-008)
version = "0.1.0"
description = "Videoda kan/vahşet bölgelerini 30 sn önceden bulup hafifçe ve bölgesel bulanıklaştırma"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.0", "mypy>=1.8", "types-PyYAML"]
# M1: gerçek modeller. SAM 2.1 / EdgeTAM transformers içinde (ayrı sam2 paketi gerekmez)
models = ["torch>=2.3", "torchvision>=0.18", "transformers>=5.0", "pillow>=10", "sentencepiece>=0.2", "protobuf>=4", "torchaudio>=2.3"]
player = ["av>=12", "sounddevice>=0.4"]  # ses ana saat; yoksa ffplay / sessiz
data = ["roboflow>=1.1"]
train = ["rfdetr[train]>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "archive/"

[tool.ruff]
line-length = 120
target-version = "py310"
# Eski Faster R-CNN kodu arşiv: değiştirilmeden tutuluyor, lint dışı
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
