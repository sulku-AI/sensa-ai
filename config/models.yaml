# Hugging Face model kimlikleri (sayı değil; params.yaml dışında). Seçim: docs/MODEL_ARASTIRMA.md, D-011.
# Hepsi Apache 2.0. İndirme kullanıcının makinesinde olur (bulut oturumunda HF kapalı).

gate:
  siglip: google/siglip-base-patch16-224

detect:
  llmdet_tiny: iSEE-Laboratory/llmdet_tiny          # 1. tercih
  llmdet_base: iSEE-Laboratory/llmdet_base
  grounding_dino_tiny: IDEA-Research/grounding-dino-tiny
  owlv2_base: google/owlv2-base-patch16-ensemble
  rfdetr_seg: models/rfdetr_seg_nano/checkpoint_best_total.pth   # kendi eğitimimiz (tools/train_rfdetr); .pth = yerel kontrol noktası

track:
  sam2_tiny: facebook/sam2.1-hiera-tiny             # 1. tercih (2060)
  sam2_small: facebook/sam2.1-hiera-small
  edgetam: facebook/EdgeTAM@refs/pr/1              # M5 ana hedef; transformers ağırlıkları yalnız HF PR #1'de (ana dalda yalnız edgetam.pt)

default:
  gate: siglip
  detect: rfdetr_seg               # D-016 (kullanıcı): kendi eğitimimiz, M5'te 25 ms; dosya yoksa owlv2_base'e düşer (D-014)
  track: edgetam                  # M5 ana hedef (D-012); 2060 için sam2_tiny
