# Metin istemleri (prompt). Sayı değil, bu yüzden params.yaml dışında.
# Pozitif istemler bulanıklaştırılacak bölgeleri, negatifler kapı aşamasında
# yanlış alarmı bastırmak için karşılaştırma sınıflarını tanımlar.

positive:
  - blood
  - bleeding wound
  - open wound
  - gore

# Kansız ama renk/doku olarak benzeyen şeyler (H-02 negatif seti ile aynı liste)
negative:
  - ketchup
  - tomato sauce
  - red paint
  - red wine
  - red light
  - lipstick
  - red fabric
  - raw meat on a cutting board

# Vekil (proxy) istem: boru hattını kan olmadan uçtan uca sınamak için (D-005).
proxy:
  - red balloon

# Ses ipucu (D-019): AudioSet sınıf adları (AST modelinin id2label'i). Modelde olmayan ad uyarıyla yok sayılır.
# Grup olasılığı = gruptaki en yüksek sınıf. Kullanım: src/sensa_ai/audio_cue.py
audio_vocal:            # güveni artırır
  - Screaming
  - Shout
  - Yell
  - Battle cry
  - Children shouting
  - Crying, sobbing
  - Whimper
  - Wail, moan
  - Groan
  - Gasp

audio_violence:         # güveni artırır (audio.violence_weight ile)
  - Gunshot, gunfire
  - Machine gun
  - Fusillade
  - Explosion
  - Slap, smack
  - Smash, crash
  - Shatter

audio_kitchen:          # güveni azaltır (yemek programı, mutfak sahnesi)
  - Frying (food)
  - Sizzle
  - Chopping (food)
  - Dishes, pots, and pans
  - Cutlery, silverware
  - Microwave oven
  - Blender
